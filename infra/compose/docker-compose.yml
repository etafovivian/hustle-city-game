# Local development dependencies. Apps run on the host via `pnpm dev`.
# Ports are offset from defaults to avoid clashing with other local stacks.
name: hustle-city

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hustle
      POSTGRES_PASSWORD: hustle
      POSTGRES_DB: hustle_city
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hustle -d hustle_city"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional for Stage A: queues and presence later. Never owns balances.
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for images and work submissions.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hustle
      MINIO_ROOT_PASSWORD: hustle-dev-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  miniodata:
