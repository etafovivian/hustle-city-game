<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Outfit, 'Helvetica Neue', Arial, sans-serif">
  <title>New Lagos city plan</title>
  <defs>
    <pattern id="g" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r="1" fill="#b98e58" />
      <circle cx="9" cy="10" r=".8" fill="#e3c590" />
    </pattern>
    <pattern id="waves" width="40" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 7q10-6 20 0t20 0" fill="none" stroke="#7fc3df" stroke-opacity=".35" stroke-width="1.5" />
    </pattern>
  </defs>

  <!-- Land and water -->
  <rect width="1200" height="900" fill="#cfa874" />
  <rect width="1200" height="900" fill="url(#g)" />
  <!-- Atlantic Ocean -->
  <path d="M0 830 C220 805 420 845 640 815 S1000 800 1200 790 V900 H0Z" fill="#1f5a80" />
  <path d="M0 830 C220 805 420 845 640 815 S1000 800 1200 790 V900 H0Z" fill="url(#waves)" />
  <!-- Lagos Lagoon, the harbour channel and Apapa's harbour -->
  <path d="M1200 520 C1050 540 960 470 880 470 C800 470 760 560 700 580 C620 610 520 590 430 600 C330 612 250 650 200 700 L170 760 C230 735 300 720 380 712 C470 702 520 720 560 708 L610 650 C700 640 760 660 860 650 C980 640 1080 680 1200 670Z" fill="#2f7ea6" />
  <path d="M1200 520 C1050 540 960 470 880 470 C800 470 760 560 700 580 C620 610 520 590 430 600 C330 612 250 650 200 700 L170 760 C230 735 300 720 380 712 C470 702 520 720 560 708 L610 650 C700 640 760 660 860 650 C980 640 1080 680 1200 670Z" fill="url(#waves)" />
  <path d="M560 708 C590 740 610 780 640 815 L600 822 C580 790 560 750 530 716Z" fill="#2f7ea6" />
  <!-- Island and peninsula outlines -->
  <path d="M610 650 C700 640 760 660 860 650 C980 640 1080 680 1200 670 V790 C1000 800 820 812 660 816 C635 780 600 735 560 708Z" fill="#d9b886" />
  <path d="M610 650 C700 640 760 660 860 650 C980 640 1080 680 1200 670 V790 C1000 800 820 812 660 816 C635 780 600 735 560 708Z" fill="url(#g)" />
  <!-- Beach strip -->
  <path d="M660 816 C820 812 1000 800 1200 790 V806 C1000 816 820 826 668 830Z" fill="#f0dcae" />

  <!-- Expressways -->
  <g fill="none" stroke="#4a4540" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M600 90 L430 210 L600 340 L820 390" />
    <path d="M430 210 L400 410 L600 340" />
    <path d="M400 410 L280 650" />
    <path d="M600 340 L600 90" />
    <!-- Third Mainland Bridge: long curve over the lagoon -->
    <path d="M900 300 C960 420 860 520 760 570 C690 610 650 640 640 690" />
    <!-- Carter / Eko bridge equivalent -->
    <path d="M470 470 L560 690" />
    <!-- Island and Lekki corridor -->
    <path d="M560 700 L720 730 L900 735 L1180 735" />
    <path d="M820 390 L900 300" />
  </g>
  <g fill="none" stroke="#f2c14e" stroke-width="1.6" stroke-dasharray="8 7">
    <path d="M600 90 L430 210 L600 340 L820 390" />
    <path d="M430 210 L400 410 L600 340" />
    <path d="M400 410 L280 650" />
    <path d="M600 340 L600 90" />
    <path d="M900 300 C960 420 860 520 760 570 C690 610 650 640 640 690" />
    <path d="M470 470 L560 690" />
    <path d="M560 700 L720 730 L900 735 L1180 735" />
    <path d="M820 390 L900 300" />
  </g>
  <text x="845" y="505" font-size="13" font-weight="800" fill="#fff" transform="rotate(-48 845 505)" letter-spacing="1">THIRD MAINLAND BRIDGE</text>
  <text x="980" y="600" font-size="20" font-weight="800" fill="#cfe9f6" font-style="italic">Lagos Lagoon</text>
  <text x="140" y="870" font-size="20" font-weight="800" fill="#cfe9f6" font-style="italic">Atlantic Ocean</text>

  <!-- Districts: phase colour = when it opens -->
  <g font-weight="800" text-anchor="middle">
    <!-- Phase 0 (now) -->
    <circle cx="600" cy="340" r="44" fill="#ffc72c" stroke="#0a0f24" stroke-width="3" />
    <text x="600" y="337" font-size="15" fill="#0a0f24">Junction 101</text>
    <text x="600" y="355" font-size="10" fill="#0a0f24">START · NOW</text>

    <!-- Phase 1 -->
    <g fill="#2e7d4f" stroke="#0a0f24" stroke-width="2.5">
      <rect x="745" y="350" width="150" height="62" rx="14" />
      <rect x="320" y="378" width="160" height="62" rx="14" />
    </g>
    <text x="820" y="377" font-size="15" fill="#fff">Tech Mile</text>
    <text x="820" y="396" font-size="10" fill="#d8f5e2">like Yaba · gadgets, jobs</text>
    <text x="400" y="405" font-size="15" fill="#fff">Owambe Gardens</text>
    <text x="400" y="424" font-size="10" fill="#d8f5e2">like Surulere · artisans, parties</text>

    <!-- Phase 2 -->
    <g fill="#2a5aa8" stroke="#0a0f24" stroke-width="2.5">
      <rect x="350" y="178" width="160" height="62" rx="14" />
      <rect x="195" y="625" width="150" height="62" rx="14" />
    </g>
    <text x="430" y="205" font-size="15" fill="#fff">Danfo Terminal</text>
    <text x="430" y="224" font-size="10" fill="#dbe6fb">like Oshodi · transport, big market</text>
    <text x="270" y="652" font-size="15" fill="#fff">Apapa Port</text>
    <text x="270" y="671" font-size="10" fill="#dbe6fb">wholesale, imports</text>

    <!-- Phase 3: across the bridge -->
    <g fill="#8a3fa0" stroke="#0a0f24" stroke-width="2.5">
      <rect x="500" y="690" width="140" height="62" rx="14" />
      <rect x="670" y="700" width="160" height="62" rx="14" />
    </g>
    <text x="570" y="717" font-size="15" fill="#fff">Marina Wharf</text>
    <text x="570" y="736" font-size="10" fill="#f0dcf7">like Lagos Island · big market</text>
    <text x="750" y="727" font-size="15" fill="#fff">Island Heights</text>
    <text x="750" y="746" font-size="10" fill="#f0dcf7">like Ikoyi/VI · showrooms</text>

    <!-- Phase 4 -->
    <g fill="#b2452f" stroke="#0a0f24" stroke-width="2.5">
      <rect x="940" y="700" width="160" height="62" rx="14" />
      <rect x="520" y="60" width="160" height="62" rx="14" />
      <rect x="880" y="808" width="150" height="40" rx="12" />
    </g>
    <text x="1020" y="727" font-size="15" fill="#fff">Lekki Gardens</text>
    <text x="1020" y="746" font-size="10" fill="#fbe1da">like Lekki · homes, estates</text>
    <text x="600" y="87" font-size="15" fill="#fff">Airport Ridge</text>
    <text x="600" y="106" font-size="10" fill="#fbe1da">like Ikeja · export, travel</text>
    <text x="955" y="833" font-size="13" fill="#fff">Atlantic Beach · events</text>
  </g>

  <!-- Legend -->
  <g transform="translate(24 24)">
    <rect width="270" height="170" rx="16" fill="#0a0f24" opacity=".92" />
    <text x="18" y="32" font-size="19" font-weight="900" fill="#fff">New Lagos · city plan</text>
    <text x="18" y="52" font-size="11" fill="#c7cbe0">Inspired by real Lagos, not a copy of it</text>
    <g font-size="12" font-weight="700" fill="#fff">
      <circle cx="26" cy="76" r="7" fill="#ffc72c" /><text x="42" y="80">Phase 0 · live now</text>
      <circle cx="26" cy="98" r="7" fill="#2e7d4f" /><text x="42" y="102">Phase 1 · Stage B1 (artisans)</text>
      <circle cx="26" cy="120" r="7" fill="#2a5aa8" /><text x="42" y="124">Phase 2 · Stage B2 (retail, jobs)</text>
      <circle cx="26" cy="142" r="7" fill="#8a3fa0" /><text x="42" y="146">Phase 3 · across the bridge</text>
      <circle cx="26" cy="164" r="7" fill="#b2452f" /><text x="42" y="168" fill="#fff">Phase 4 · late game</text>
    </g>
  </g>
  <g transform="translate(1130 70)" text-anchor="middle" font-weight="900">
    <path d="M0-30 L10 0 L0-6 L-10 0Z" fill="#0a0f24" />
    <text y="18" font-size="16" fill="#0a0f24">N</text>
  </g>
</svg>
